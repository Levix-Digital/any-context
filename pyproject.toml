[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "any-context"
version = "0.11.1"
description = "Transform any file, drive, or folder into a living, real-time AI context."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Levi Silveira" }
]
dependencies = [
    "chromadb",
    "python-docx",
    "llama-index",
    "llama-index-vector-stores-chroma",
    "llama-index-readers-file",
    "llama-index-embeddings-openai",
    "docx2txt",
    "langchain",
    "langchain-openai",
    "langgraph-checkpoint-sqlite",
    "langgraph-cli",
    "pydantic",
    "questionary",
    "tqdm",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "langchain-anthropic>=1.5.6",
    "langchain-google-genai>=4.3.4",
    "langchain-groq>=1.1.3",
]

[project.scripts]
actx = "any_context.cli.entrypoint:entrypoint"
anycontext = "any_context.cli.entrypoint:entrypoint"
any-context = "any_context.cli.entrypoint:entrypoint"
ac = "any_context.cli.entrypoint:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"any_context" = ["config/*.md"]
