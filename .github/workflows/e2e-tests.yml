name: Rust Workspace Test Suite

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  # One run per pull request (superseded runs are cancelled) and one per pushed commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  rust-tests:
    name: Cargo Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust Dependency Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-cargo-test
          cache-all-crates: "true"
          cache-targets: "false"

      # ADR-130: neural tests need the official ONNX Runtime library (loaded dynamically).
      - name: Provision ONNX Runtime (official Microsoft CPU build)
        shell: bash
        run: |
          bash scripts/fetch_onnxruntime.sh .ort
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "ORT_DYLIB_PATH=$(cygpath -w "$PWD/.ort/onnxruntime.dll")" >> "$GITHUB_ENV"
          else
            echo "ORT_DYLIB_PATH=$PWD/.ort/libonnxruntime.so" >> "$GITHUB_ENV"
          fi
          echo "ACTX_REQUIRE_ORT=1" >> "$GITHUB_ENV"

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

      - name: Show sccache statistics
        shell: bash
        run: ${SCCACHE_PATH} --show-stats
