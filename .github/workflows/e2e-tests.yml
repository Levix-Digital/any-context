name: End-to-End (E2E) Test Suite

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  e2e-tests:
    name: E2E Tests (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Execute E2E Lifecycle Test Suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'mock_test_ci_key' }}
        run: |
          python tests/test_e2e_full_lifecycle.py
