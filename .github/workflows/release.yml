name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: actx-linux
            asset_name: actx-linux-x86_64
          - os: windows-latest
            artifact_name: actx-windows
            asset_name: actx-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Aggressive Disk Space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /var/lib/docker
          sudo apt-get clean

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pyinstaller -r requirements.txt
          pip install --no-cache-dir -e .

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --clean --onefile --collect-all chromadb --collect-all tiktoken --collect-all tiktoken_ext --exclude-module torch --exclude-module nvidia --exclude-module scipy --exclude-module matplotlib --name actx-windows-x86_64 --add-data "config;config" main.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --clean --onefile --collect-all chromadb --collect-all tiktoken --collect-all tiktoken_ext --exclude-module torch --exclude-module nvidia --exclude-module scipy --exclude-module matplotlib --name actx-linux-x86_64 --add-data "config:config" main.py

      - name: Copy Installer & Uninstaller Scripts to Dist
        shell: bash
        run: |
          cp scripts/install.ps1 dist/
          cp scripts/install.sh dist/
          cp scripts/uninstall.ps1 dist/
          cp scripts/uninstall.sh dist/

      - name: Create Release and Upload Assets to Public Repo
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: Levix-Digital/any-context-releases
          files: dist/*
          tag_name: ${{ github.ref_name }}
          name: AnyContext ${{ github.ref_name }}
          token: ${{ secrets.RELEASES_PAT || secrets.GITHUB_TOKEN }}



