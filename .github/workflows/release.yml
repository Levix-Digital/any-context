name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  # Called by tag-on-merge.yml for the final release (a tag pushed with GITHUB_TOKEN does
  # not trigger this workflow on its own).
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build-binaries:
    name: Build Binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      # The tag being released: the pushed tag, or the input of a workflow_call.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/') }}
      # vX.Y.Z-rc.N tags are release candidates: published as pre-releases, never as latest.
      IS_RC: ${{ contains(inputs.tag || github.ref_name, '-rc') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: actx-linux
            asset_name: actx-linux-x86_64
          - os: windows-latest
            artifact_name: actx-windows
            asset_name: actx-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Free Aggressive Disk Space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /var/lib/docker
          sudo apt-get clean

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust Dependency Cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "actx-rust-deps"
          cache-all-crates: "true"
          cache-targets: "false"

      - name: Build Native Rust Binaries & Core Engine
        shell: bash
        run: |
          cargo build --release -p actx-cli -p actx-installer -p any-context-core-rs

      - name: Show sccache statistics
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

      # ADR-130 / D15: ship the official Microsoft ONNX Runtime (CPU) inside the release package.
      - name: Bundle ONNX Runtime (official Microsoft CPU build, SHA-256 verified)
        shell: bash
        run: bash scripts/fetch_onnxruntime.sh dist

      # ADR-130: the executable must keep zero link-time dependencies on ONNX Runtime / DirectML / MSVCP.
      - name: Verify executable imports (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --quiet pefile
          python - <<'EOF'
          import pefile, sys
          forbidden = {"onnxruntime.dll", "directml.dll", "d3d12.dll", "dxgi.dll", "msvcp140.dll", "msvcp140_1.dll", "vcruntime140_1.dll"}
          for exe in ["target/release/actx.exe", "target/release/actx-installer.exe"]:
              pe = pefile.PE(exe)
              imports = {e.dll.decode().lower() for e in pe.DIRECTORY_ENTRY_IMPORT}
              bad = sorted(imports & forbidden)
              print(exe, "imports:", sorted(imports))
              if bad:
                  sys.exit(f"{exe} must not import {bad}")
          EOF

      - name: Verify executable imports (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          readelf -d target/release/actx | grep NEEDED
          if readelf -d target/release/actx | grep -qi onnxruntime; then
            echo "actx must not link onnxruntime at load time"; exit 1
          fi

      - name: Verify model catalog URLs (live, ADR-118 / ADR-130)
        if: runner.os == 'Linux'
        shell: bash
        run: cargo test --release -p any-context-core-rs --lib catalog_urls -- --ignored

      - name: Package Release Assets (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/actx.exe dist/actx.exe
          cp target/release/actx-installer.exe dist/actx-installer.exe
          cp dist/actx.exe dist/actx-windows-x86_64.exe
          cp dist/actx.exe dist/actx-core.exe
          test -f dist/onnxruntime.dll

          if command -v 7z >/dev/null 2>&1; then
            (cd dist && 7z a -tzip -mx=3 actx-windows-x86_64.zip actx.exe actx-core.exe actx-installer.exe onnxruntime.dll)
          elif command -v tar >/dev/null 2>&1; then
            tar -a -cf dist/actx-windows-x86_64.zip -C dist actx.exe actx-core.exe actx-installer.exe onnxruntime.dll
          else
            powershell -Command "Compress-Archive -Path 'dist/actx.exe','dist/actx-core.exe','dist/actx-installer.exe','dist/onnxruntime.dll' -DestinationPath 'dist/actx-windows-x86_64.zip' -Force"
          fi

      - name: Package Release Assets (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/actx dist/actx
          cp target/release/actx-installer dist/actx-installer
          cp dist/actx dist/actx-linux-x86_64
          cp dist/actx dist/actx-core
          test -f dist/libonnxruntime.so
          tar -czf dist/actx-linux-x86_64.tar.gz -C dist actx actx-core actx-installer libonnxruntime.so

      - name: Normalize line endings for Unix scripts
        if: runner.os == 'Linux'
        run: |
          sed -i 's/\r$//' scripts/install.sh
          sed -i 's/\r$//' scripts/uninstall.sh

      - name: Publish Linux Release Assets
        if: env.PUBLISH == 'true' && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          repository: Levix-Digital/any-context-releases
          files: |
            dist/actx-installer
            dist/actx-linux-x86_64.tar.gz
            dist/actx-linux-x86_64
            dist/actx
            dist/actx-core
            scripts/install.sh
            scripts/uninstall.sh
          tag_name: ${{ env.RELEASE_TAG }}
          name: AnyContext ${{ env.RELEASE_TAG }}
          prerelease: ${{ env.IS_RC == 'true' }}
          make_latest: ${{ env.IS_RC != 'true' }}
          generate_release_notes: true
          token: ${{ secrets.RELEASES_PAT || secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true

      - name: Publish Windows Release Assets
        if: env.PUBLISH == 'true' && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          repository: Levix-Digital/any-context-releases
          files: |
            dist/actx-installer.exe
            dist/actx-windows-x86_64.zip
            dist/actx-windows-x86_64.exe
            dist/actx.exe
            dist/actx-core.exe
            scripts/install.ps1
            scripts/uninstall.ps1
          tag_name: ${{ env.RELEASE_TAG }}
          name: AnyContext ${{ env.RELEASE_TAG }}
          prerelease: ${{ env.IS_RC == 'true' }}
          make_latest: ${{ env.IS_RC != 'true' }}
          generate_release_notes: true
          token: ${{ secrets.RELEASES_PAT || secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true

      - name: Upload Binary Artifact (CI Debugging)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          retention-days: 1
          if-no-files-found: ignore
