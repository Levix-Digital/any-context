name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-binaries:
    name: Build Binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: actx-linux
            asset_name: actx-linux-x86_64
          - os: windows-latest
            artifact_name: actx-windows
            asset_name: actx-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Aggressive Disk Space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /var/lib/docker
          sudo apt-get clean

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust Dependency Cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: "actx-rust-deps"
          cache-all-crates: "true"
          cache-targets: "false"

      - name: Build Native Rust Binaries & Core Engine
        shell: bash
        run: |
          cargo build --release -p actx-cli -p actx-installer -p any-context-core-rs

      - name: Show sccache statistics
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

      - name: Package Release Assets (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/actx.exe dist/actx.exe
          cp target/release/actx-installer.exe dist/actx-installer.exe
          cp dist/actx.exe dist/actx-windows-x86_64.exe
          cp dist/actx.exe dist/actx-core.exe

          if command -v 7z >/dev/null 2>&1; then
            (cd dist && 7z a -tzip -mx=3 actx-windows-x86_64.zip actx.exe actx-core.exe actx-installer.exe)
          elif command -v tar >/dev/null 2>&1; then
            tar -a -cf dist/actx-windows-x86_64.zip -C dist actx.exe actx-core.exe actx-installer.exe
          else
            powershell -Command "Compress-Archive -Path 'dist/actx.exe','dist/actx-core.exe','dist/actx-installer.exe' -DestinationPath 'dist/actx-windows-x86_64.zip' -Force"
          fi

      - name: Package Release Assets (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/actx dist/actx
          cp target/release/actx-installer dist/actx-installer
          cp dist/actx dist/actx-linux-x86_64
          cp dist/actx dist/actx-core
          tar -czf dist/actx-linux-x86_64.tar.gz -C dist actx actx-core actx-installer

      - name: Normalize line endings for Unix scripts
        if: runner.os == 'Linux'
        run: |
          sed -i 's/\r$//' scripts/install.sh
          sed -i 's/\r$//' scripts/uninstall.sh

      - name: Publish Linux Release Assets
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          repository: Levix-Digital/any-context-releases
          files: |
            dist/actx-installer
            dist/actx-linux-x86_64.tar.gz
            dist/actx-linux-x86_64
            dist/actx
            dist/actx-core
            scripts/install.sh
            scripts/uninstall.sh
          tag_name: ${{ github.ref_name }}
          name: AnyContext ${{ github.ref_name }}
          token: ${{ secrets.RELEASES_PAT || secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true

      - name: Publish Windows Release Assets
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          repository: Levix-Digital/any-context-releases
          files: |
            dist/actx-installer.exe
            dist/actx-windows-x86_64.zip
            dist/actx-windows-x86_64.exe
            dist/actx.exe
            dist/actx-core.exe
            scripts/install.ps1
            scripts/uninstall.ps1
          tag_name: ${{ github.ref_name }}
          name: AnyContext ${{ github.ref_name }}
          token: ${{ secrets.RELEASES_PAT || secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true

      - name: Upload Binary Artifact (CI Debugging)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          retention-days: 1
          if-no-files-found: ignore
