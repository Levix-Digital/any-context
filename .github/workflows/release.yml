name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: actx-linux
            asset_name: actx-linux-x86_64
          - os: windows-latest
            artifact_name: actx-windows
            asset_name: actx-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Aggressive Disk Space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /var/lib/docker
          sudo apt-get clean

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir "pyinstaller>=6.16.0" -r requirements.txt
          pip install --no-cache-dir -e .
          cd src/any_context/tui
          bun install --production
          cd ../../..

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --clean --onefile --paths src --collect-all any_context --collect-all lancedb --collect-all pyarrow --collect-all tiktoken --collect-all tiktoken_ext --exclude-module torch --exclude-module nvidia --exclude-module scipy --exclude-module matplotlib --name actx-windows-x86_64 --add-data "src/any_context/config;any_context/config" --add-data "src/any_context/tui;any_context/tui" main.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --clean --onefile --paths src --collect-all any_context --collect-all lancedb --collect-all pyarrow --collect-all tiktoken --collect-all tiktoken_ext --exclude-module torch --exclude-module nvidia --exclude-module scipy --exclude-module matplotlib --name actx-linux-x86_64 --add-data "src/any_context/config:any_context/config" --add-data "src/any_context/tui:any_context/tui" main.py

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: actx-linux
          path: dist

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: actx-windows
          path: dist

      - name: Normalize line endings for Unix scripts
        run: |
          sed -i 's/\r$//' scripts/install.sh
          sed -i 's/\r$//' scripts/uninstall.sh

      - name: Publish Unified Release
        uses: softprops/action-gh-release@v2
        with:
          repository: Levix-Digital/any-context-releases
          files: |
            dist/actx-linux-x86_64
            dist/actx-windows-x86_64.exe
            scripts/install.ps1
            scripts/install.sh
            scripts/uninstall.ps1
            scripts/uninstall.sh
          tag_name: ${{ github.ref_name }}
          name: AnyContext ${{ github.ref_name }}
          token: ${{ secrets.RELEASES_PAT || secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true



