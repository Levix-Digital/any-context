[package]
name = "actx-installer"
version = "0.31.1"
edition = "2021"
authors = ["LeviGuilherme <contato@levix.digital>"]
description = "Native cross-platform installer, atomic updater, and launcher shim for AnyContext"

[dependencies]
ureq = { version = "2.10", features = ["json", "tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
tar = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
dirs = "5.0"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem"] }

[[bin]]
name = "actx-installer"
path = "src/bin/actx-installer.rs"

[[bin]]
name = "actx-shim"
path = "src/bin/actx-shim.rs"
