[package]
name = "actx-onnx"
version = "0.40.0"
edition = "2021"
authors = ["LeviGuilherme <contato@levix.digital>"]
description = "Specialized local ONNX neural execution engine and runtime adapters for AnyContext"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["sync", "macros", "rt"] }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3.10"
