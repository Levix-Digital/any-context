[package]
name = "actx-lm"
version = "0.31.0"
edition = "2021"
authors = ["LeviGuilherme <contato@levix.digital>"]
description = "Universal, lightweight, and modular Language Model (LLM & SLM) façade and streaming provider engine for Rust"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.40", features = ["rt", "sync", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
async-trait = "0.1"
thiserror = "2.0"
bytes = "1.7"

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }
