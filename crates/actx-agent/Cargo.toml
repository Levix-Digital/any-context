[package]
name = "actx-agent"
version = "0.31.0"
edition = "2021"
authors = ["LeviGuilherme <contato@levix.digital>"]
description = "Deterministic ReAct and Deep Search agent orchestrator with finite state machine, polymorphic tool registry, and session persistence for Rust"
license = "MIT OR Apache-2.0"

[dependencies]
actx-lm = { path = "../actx-lm" }
tokio = { version = "1.40", features = ["rt", "sync", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "2.0"
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }
