[package]
name = "any-context-core-rs"
version = "0.30.9"
edition = "2021"
authors = ["LeviGuilherme <contato@levix.digital>"]
description = "High-performance Rust core engine for AnyContext (Ingestion Router, AST/Markdown chunkers, and RRF retrieval)"

[lib]
name = "any_context_core_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
pulldown-cmark = { version = "0.11", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
quick-xml = "0.37"
toml = "0.8"
csv = "1.3"
calamine = "0.26"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-go = "0.23.4"
tree-sitter-rust = "0.23.2"
tree-sitter-c = "0.23.4"
tree-sitter-cpp = "0.23.4"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-swift = "0.6.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.23.11"
tree-sitter-lua = "0.2.0"
tree-sitter-dart = "0.0.4"

[features]
default = []
