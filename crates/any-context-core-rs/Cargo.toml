[package]
name = "any-context-core-rs"
version = "0.32.0"
edition = "2021"
authors = ["LeviGuilherme <contato@levix.digital>"]
description = "High-performance Rust core engine for AnyContext (Ingestion Router, AST/Markdown chunkers, and RRF retrieval)"

[lib]
name = "any_context_core_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
actx-lm = { path = "../actx-lm" }
actx-agent = { path = "../actx-agent" }
pyo3 = { version = "0.22", features = ["extension-module"] }
async-trait = "0.1"
pulldown-cmark = { version = "0.11", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"
quick-xml = "0.37"
toml = "0.8"
regex = "1.11"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
csv = "1.3"
calamine = "0.26"
lopdf = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
walkdir = "2.5"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-go = "0.23.4"
tree-sitter-rust = "0.23.2"
tree-sitter-c = "0.23.4"
tree-sitter-cpp = "0.23.4"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-swift = "0.6.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.23.11"
tree-sitter-lua = "0.2.0"
tree-sitter-dart = "0.0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "macros"] }
futures = "0.3"
arrow = { version = "58", default-features = false }
arrow-schema = "58"
arrow-array = "58"
lancedb = { version = "0.39.0", features = ["remote"] }
dirs = "6.0"

[features]
default = []
